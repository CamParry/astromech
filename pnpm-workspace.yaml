packages:
    - 'packages/schema-engine'
    - 'packages/admin'
    - 'packages/astromech'
    - 'packages/plugins/*'
    - 'apps/*'

# Native postinstall scripts. pnpm blocks these by default; all three ship
# platform binaries that do not work unless their install script runs.
# workerd backs the D1 local-emulation test, so blocking it fails the suite.
allowBuilds:
    esbuild: true
    sharp: true
    workerd: true

# Never prompt before removing node_modules when the layout changes. The prompt
# reads stdin, and scripts/check-boot.mjs spawns pnpm with `stdio: 'inherit'`,
# so a prompt there waits on a terminal that isn't attached and hangs the gate.
confirmModulesPurge: false

# `libsql` and `@libsql/*` are hoisted so Vite can externalise them. Vite
# externalises a server dependency only if it can resolve it from the app root,
# and `libsql` reaches `apps/demo` transitively through `@libsql/client`. When
# it cannot be resolved, Vite inlines it instead. libsql loads its native binding
# with a dynamic `require('@libsql/darwin-arm64')`, which Rollup can only
# replace with a stub that throws. So the whole failure is decided at build time
# and does not surface until the first render, where the node adapter answers
# the unhandled rejection by holding the socket open rather than returning 500.
publicHoistPattern:
    - 'libsql'
    - '@libsql/*'
