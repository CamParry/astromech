name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    # The schedule catches a new upstream release breaking the install guide's
    # unpinned install command while nothing is being pushed.
    schedule:
        - cron: '0 6 * * 1'
    workflow_dispatch:

# The event is in the group so a scheduled run and a push do not cancel each
# other.
concurrency:
    group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
    cancel-in-progress: true

# The gate is one script, scripts/verify.ts, so CI and a developer run the same
# checks and the two cannot drift. It runs the tasks in turbo.json through
# Turborepo. `pnpm run verify --all` runs the whole gate on the Active LTS;
# `verify:runtime --all` runs only the version-sensitive subset, the test
# suites and the two boot checks, on the floor Node version, so those run on
# both while lint, typecheck and the build, whose output no Node version
# changes, run once. Both pass `--all`: on main the merge base with
# origin/main is HEAD, so `--affected` would select nothing. Each job keeps
# Turborepo's cache between runs with actions/cache, so a task whose inputs
# did not change since the last run on any branch is restored, not rerun.
# Three jobs sit outside verify: the relationships-index parity check (CI-only,
# needs a seeded database), the CSS lint, and the install guide check, which
# installs the packed packages into a new site with npm and with pnpm and needs
# the npm registry.
#
# `pnpm/action-setup` takes its version from `packageManager` in the root
# package.json, so the toolchain is pinned in one place. It runs before
# `setup-node`, which needs pnpm on PATH already to resolve `cache: pnpm`.
#
# 22 is the published packages' `engines.node`, the floor a consumer may
# install on; 24 is the Active LTS most of them run. `22` resolves to the
# newest 22.x release, which is at least the root `engines.node`, 22.18: the
# scripts are TypeScript run by plain `node`, which strips types without a flag
# from that release. Node 20 cannot be here: pnpm 11 requires at least
# v22.13, and `cache: pnpm` makes `setup-node` run `pnpm store path`, so a
# Node 20 job dies at that step before installing anything. Node 20 reached end
# of life in April 2026 in any case.
#
# Both boot checks serve a built site, which refuses every request without
# BETTER_AUTH_SECRET. This value signs sessions on a scratch site that lives for
# one run, so it is not a secret and sits here in the open.
#
# TURBO_CACHE_DIR is where verify keeps Turborepo's cache, and the directory
# each verify job saves and restores. `.turbo/` is gitignored.
env:
    ACTIVE_LTS: 24
    BETTER_AUTH_SECRET: ci-boot-check-secret-0123456789abcdef
    TURBO_CACHE_DIR: ${{ github.workspace }}/.turbo/cache

# Each job's `timeout-minutes` is more than twice its normal duration. Without
# one, a hung step runs until GitHub's six-hour limit. verify gives its
# Turborepo run a shorter deadline, so a hang fails there first and prints the
# output so far before the job is cancelled.
jobs:
    gate:
        name: Gate (Node 24)
        runs-on: ubuntu-latest
        timeout-minutes: 35
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ env.ACTIVE_LTS }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # The boot checks in the gate load /cms in headless chromium. The
            # browser is not part of the npm install, so it is fetched here.
            - run: pnpm exec playwright install --with-deps chromium
            # Keyed on the commit, so every run saves its own; the restore key
            # takes the newest one this job saved.
            - uses: actions/cache@v6
              with:
                  path: ${{ env.TURBO_CACHE_DIR }}
                  key: turbo-gate-${{ github.sha }}
                  restore-keys: turbo-gate-
            - run: pnpm run verify --all

    runtime:
        name: Runtime (Node 22)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright install --with-deps chromium
            - uses: actions/cache@v6
              with:
                  path: ${{ env.TURBO_CACHE_DIR }}
                  key: turbo-runtime-${{ github.sha }}
                  restore-keys: turbo-runtime-
            # The test suites and both boot checks, the only checks whose result
            # a Node version can change, on the floor version. The gate job
            # covers them on the Active LTS.
            - run: pnpm run verify:runtime --all

    index:
        name: Relationships Index (Node 24)
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ env.ACTIVE_LTS }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # `index:rebuild` runs the built CLI rather than tsx, so the bundle
            # has to exist first. It loads the runtime and never a declaration,
            # so the declaration-free build is enough.
            - run: pnpm run build:js
            # The check compares the index against the field data it is derived
            # from, so it needs content: against an empty database it scans zero
            # sources and passes vacuously. The demo seed is the only fixture
            # with relationships in it, and it writes index rows through the
            # same collector the services use — so this is a real parity check
            # on the demo config, plugins included. Both commands write
            # `apps/demo/database.db`, which is gitignored and absent in CI.
            - run: pnpm -F astromech-demo db:init
            - run: pnpm run db:seed:demo
            - run: pnpm -F astromech-demo index:rebuild --check

    css:
        name: CSS (Node 24)
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ env.ACTIVE_LTS }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # verify leaves the admin styles' lint to the pre-commit hook for
            # dev-loop speed; CI enforces it here against a `--no-verify` commit.
            - run: pnpm run lint:css

    install:
        name: Install guide (${{ matrix.package-manager }}, Node 24)
        runs-on: ubuntu-latest
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                package-manager: [npm, pnpm]
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ env.ACTIVE_LTS }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright install --with-deps chromium
            # check:install packs each package from its `dist`.
            - run: pnpm run build
            - run: pnpm run check:install -- --package-manager ${{ matrix.package-manager }}
