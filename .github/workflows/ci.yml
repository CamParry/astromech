name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# `pnpm/action-setup` takes its version from `packageManager` in the root
# package.json, so the toolchain is pinned in one place. It runs before
# `setup-node`, which needs pnpm on PATH already to resolve `cache: pnpm`.
#
# Two Node versions, and only where they can differ. 22 is `engines.node`, the
# floor a consumer may install on; 24 is the Active LTS most of them run. Test
# and Boot execute the runtime, so both matter there. Lint, Type Check and
# Build run eslint, tsc and tsup, whose output does not vary across the two, so
# doubling them would buy nothing — they pin the Active LTS.
#
# Node 20 is not here and cannot be: pnpm 11 requires at least v22.13, and
# `cache: pnpm` makes `setup-node` run `pnpm store path`, so a Node 20 job dies
# at that step before installing anything. Node 20 reached end of life in April
# 2026 in any case.
env:
    ACTIVE_LTS: 24

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ env.ACTIVE_LTS }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run lint
            - run: pnpm run lint:deps
            - run: pnpm run format:check

    typecheck:
        name: Type Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ env.ACTIVE_LTS }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # The plugin packages import `astromech` through its published
            # exports map, so they only typecheck against `dist/`. Build first.
            - run: pnpm run build
            - run: pnpm run typecheck

    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ env.ACTIVE_LTS }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build

    test:
        name: Test (Node ${{ matrix.node }})
        runs-on: ubuntu-latest
        strategy:
            # Report both versions. Cancelling the sibling on the first failure
            # would hide whether a break is version-specific, which is the only
            # question the matrix exists to answer.
            fail-fast: false
            matrix:
                node: [22, 24]
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # The assistant suite resolves `astromech` through its exports map,
            # which points at `dist/`. pnpm links the workspace package in to
            # satisfy the peer dependency, so the import resolves and needs the
            # build; under npm it did not resolve at all and the mock covered it.
            - run: pnpm run build
            - run: pnpm run test:run

    boot:
        name: Boot (Node ${{ matrix.node }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: [22, 24]
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # `apps/demo` reaches core's Node-loaded subpaths through `dist`,
            # so the packages have to be built before the demo can be.
            - run: pnpm run build
            - run: pnpm run check:boot
