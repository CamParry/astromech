name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# `pnpm/action-setup` takes its version from `packageManager` in the root
# package.json, so the toolchain is pinned in one place. It runs before
# `setup-node`, which needs pnpm on PATH already to resolve `cache: pnpm`.
#
# Node 22, not 20: pnpm 11 requires at least v22.13, and `cache: pnpm` makes
# `setup-node` run `pnpm store path`, so on 20 the job dies at that step before
# installing anything. The published packages still declare `engines.node
# >=20.0.0` — that is the runtime a consumer needs, not the toolchain this repo
# builds with, and nothing here exercises 20 any more.
jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run lint
            - run: pnpm run lint:deps
            - run: pnpm run format:check

    typecheck:
        name: Type Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # The plugin packages import `astromech` through its published
            # exports map, so they only typecheck against `dist/`. Build first.
            - run: pnpm run build
            - run: pnpm run typecheck

    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build

    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run test:run

    boot:
        name: Boot
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # `apps/demo` reaches core's Node-loaded subpaths through `dist`,
            # so the packages have to be built before the demo can be.
            - run: pnpm run build
            - run: pnpm run check:boot
