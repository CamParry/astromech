# Worktrunk project config: https://worktrunk.dev/config/
#
# `wt switch --create <branch>` runs the pre-start steps below in the new worktree, one after the
# other, and stops at the first that fails. Rerun them with `wt -C <path> hook pre-start --yes`.
# Hooks: https://worktrunk.dev/hook/. The worktree path is in the user config
# (AGENTS.md, "Branches and worktrees"); landing is `pnpm run land`, never `wt merge`.
#
# `wt switch` reads this file from the checkout it runs in, and `.worktreeinclude` from the main
# checkout, so run it from the main checkout: a change to either applies once main has it.

[[pre-start]]
# The env files `.worktreeinclude` lists, from the main checkout. With `--require-include`, a
# missing `.worktreeinclude` copies nothing rather than every gitignored file.
env = "wt step copy-ignored --require-include"

[[pre-start]]
# The demo's auth URL on this worktree's port. The copied `.env` names the main checkout's port,
# and Better Auth refuses a sign-in whose `Origin` is not that URL (403 `INVALID_ORIGIN`).
auth-url = '''
node -e "const fs = require('fs'); const file = 'apps/demo/.env'; const line = 'BETTER_AUTH_URL=http://localhost:{{ branch | hash_port }}'; const text = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : ''; const pattern = /^BETTER_AUTH_URL=.*/m; fs.writeFileSync(file, pattern.test(text) ? text.replace(pattern, line) : text + (text === '' || text.endsWith('\n') ? '' : '\n') + line + '\n')"
'''

[[pre-start]]
install = "pnpm install --frozen-lockfile"

[[pre-start]]
# The demo loads the integration from `dist/` (apps/demo/AGENTS.md).
build = "pnpm run build"

[[pre-start]]
# The demo database: the migrations, then the demo seed, which adds the users `apps/demo/AGENTS.md`
# names and clears the sign-in rate limits.
db-init = "pnpm run db:init"

[[pre-start]]
db-seed = "pnpm run db:seed:demo"

[[pre-start]]
# The browser `check:boot` drives. Downloads only when this playwright version's build is missing.
chromium = "pnpm exec playwright install chromium"

[list]
# The worktree's demo admin, on a port derived from the branch (10000-19999). Print the port with
# `wt -C <path> step eval '{{ branch | hash_port }}'`.
url = "http://localhost:{{ branch | hash_port }}/admin"
